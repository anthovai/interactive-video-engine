{% extends "base.html" %}
{% block title %}ไม่สามารถแสดงหน้านี้{% endblock %}
{% block content %}
<section class="card">
  <h1>ไม่สามารถแสดงหน้านี้</h1>
  <p data-region="error">{{ message }}</p>
  {% if reason %}<p class="muted" data-region="reason">สำหรับผู้สอนและผู้ดูแลระบบ: {{ reason }}</p>{% endif %}
  <p><a href="/">กลับหน้าบทเรียน</a></p>
</section>
{% endblock %}
