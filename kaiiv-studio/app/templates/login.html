{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<section class="card login">
  <h1>เข้าสู่ระบบ</h1>
  {% if no_users %}
  <div class="notice danger">ยังไม่มีผู้ใช้ในระบบ ผู้ติดตั้งต้องตั้งค่า <code>KAIIV_ADMIN_PASSWORD</code> แล้วเริ่มระบบใหม่</div>
  {% endif %}
  {% if error %}<div class="notice danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>ชื่อผู้ใช้<input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>รหัสผ่าน<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button id="loginbtn" type="submit" class="primary">เข้าสู่ระบบ</button>
  </form>
</section>
{% endblock %}
